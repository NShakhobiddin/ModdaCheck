<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MODDACHECK — Bojxona nazorati</title>
    <meta name="description" content="O'zbekiston bojxonasida nazorat ostidagi moddalar va dori vositalarini tekshirish: qidiruv, rasm tahlili, AI maslahatchi. VMQ-330, VMQ-818, VMQ-191.">
    <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0A0E16" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="application-name" content="MODDACHECK">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MODDACHECK">
    <meta property="og:title" content="MODDACHECK — Bojxona nazorati">
    <meta property="og:description" content="Nazorat ostidagi moddalar va dorilarni tekshirish ilovasi">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icons/icon-512.png">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">

    <!-- Oldindan kompilyatsiya qilingan Tailwind + maxsus CSS (CDN yo'q) -->
    <link rel="stylesheet" href="styles.css?v=%%VERSION%%">

    <script>
      window.__APP_VERSION__ = '%%APP_SEMVER%%';
      window.__BUILD_ID__ = '%%VERSION%%';
      window.__BUILD_DATE__ = '%%BUILD_DATE%%';
    </script>
    <!-- Telegram Web App SDK (Telegram ichida ochilganda; boshqa joyda zararsiz) -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body class="flex justify-center min-h-screen bg-backdrop text-ink">

    <div id="root" class="w-full max-w-md min-h-screen relative bg-canvas sm:border-x sm:border-line"></div>
    <noscript><div style="padding:24px;font-family:system-ui">MODDACHECK ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</div></noscript>

    <!-- Ma'lumotlar va modullar (o'z domenimizdan; oflayn ishlaydi) -->
    <script src="database.js?v=%%VERSION%%"></script>
    <script src="matcher.js?v=%%VERSION%%"></script>
    <script src="i18n.js?v=%%VERSION%%"></script>
    <script src="markdown.js?v=%%VERSION%%"></script>
    <script src="vendor/react.js"></script>
    <script src="vendor/react-dom.js"></script>
    <script src="app.js?v=%%VERSION%%"></script>

    <script>
      // Service worker: app shell oflayn ishlaydi (qidiruv, ma'lumotnoma)
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW ro\'yxatdan o\'tmadi', e); });
        });
      }
    </script>
</body>
</html>
