<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <!-- Viewport-fit=cover va scale blocklari Telegram Web App uchun juda muhim -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAQIQCHECK - Bojxona Nazorati</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React va ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            /* Webapp da select qilib bo'lmasligi uchun */
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animatsiyalar */
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
            animation: scan 2s infinite linear;
        }
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Chat bubbles */
        .chat-bubble {
            position: relative;
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .chat-bubble.user {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
            margin-left: auto;
        }
        .chat-bubble.ai {
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            margin-right: auto;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen bg-slate-50">

    <div id="root" class="w-full max-w-md bg-white min-h-[100dvh] shadow-2xl shadow-slate-300 flex flex-col border-x border-slate-200 relative overflow-hidden"></div>

    <!-- MA'LUMOTLAR BAZASINI YUKLASH (database.js) -->
    <!-- Bu fayl index.html bilan bitta papkada bo'lishi shart -->
    <script src="database.js"></script>

    <script src="app.js"></script>
</body>
</html>
